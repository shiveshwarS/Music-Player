name: hertzz
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  just_audio: ^0.9.46
  http: ^1.3.0
  audio_service: ^0.18.17
  just_audio_background: ^0.0.1-beta.15
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.3.1
  palette_generator: ^0.3.3+7
  flutter_native_splash: ^2.4.6
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.2.5
  
dev_dependencies:


  flutter_test:
    sdk: flutter
    

  flutter_lints: ^2.0.0

flutter_native_splash:
  color: "#212121"  # dark background
  image: assets/1440u.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: center

  android_12:
    color: "#212121"  # dark background
    image: assets/1100.png

flutter:
  uses-material-design: true
  assets:
    - "assets/"
  fonts:
    - family: robo
      fonts:
        - asset: assets/RoboCond.ttf
